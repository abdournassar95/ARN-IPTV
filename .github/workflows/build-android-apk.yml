name: Build Android APK (ARN IPTV Pro)

on:
  push:
    branches:
      - android
      - android-release
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع ملف APK المطلوب بناؤه'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permissions for Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output Files
        run: |
          mkdir -p output_apks
          # Find and copy all built APKs with human-friendly filenames
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output_apks/ \;
          cd output_apks
          # Rename release APK for clean download
          if [ -f "app-release.apk" ]; then
            cp app-release.apk ARN-IPTV-Pro-v2.6.0-Release.apk
          elif [ -f "app-release-unsigned.apk" ]; then
            cp app-release-unsigned.apk ARN-IPTV-Pro-v2.6.0-Release.apk
          fi
          if [ -f "app-debug.apk" ]; then
            cp app-debug.apk ARN-IPTV-Pro-v2.6.0-Debug.apk
          fi
          ls -la

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARN-IPTV-Pro-Android-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Manual Run or Tag)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-android
          name: "ARN IPTV Pro v2.6.0 — Android Edition (APK)"
          body: |
            ### 📱 تطبيق ARN IPTV Pro لأجهزة أندرويد و Android TV
            - **الإصدار**: v2.6.0
            - **المطور**: عبده رجب نصار — شركة ARN Technology
            - **المميزات**:
              - دعم كامل لهواتف أندرويد وأجهزة التلفاز الذكية (Android TV).
              - محرك فك تشفير دراما لايف الأصلي (AES-128-CBC) وإزالة تشويش `k9x_`.
              - دعم سيرفرات Xtream Codes وقوائم M3U.
              - مشغل Media3 ExoPlayer مع مضاعفة الصوت حتى 200%.
              - وضع السواد المطلق لشاشات OLED.
            
            قم بتحميل ملف `ARN-IPTV-Pro-v2.6.0-Release.apk` المرفق وتثبيته مباشرة على هاتفك!
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
